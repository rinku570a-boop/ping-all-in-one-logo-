<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ping Online">
    <title>Ping Online - Business Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        /* Thermal Printer Optimization */
        @media print {
            body * {
                visibility: hidden;
                background: white !important;
                color: black !important;
            }
            #printable-invoice, #printable-invoice * {
                visibility: visible;
            }
            #printable-invoice {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 380px !important; /* Standard for 80mm printers */
                margin: 0 !important;
                padding: 10px !important;
                border: none !important;
                box-shadow: none !important;
            }
            /* Hide non-printable elements */
            nav, aside, button, .no-print {
                display: none !important;
            }
            /* Standardize text for thermal printing */
            h1, h2, h3, p, span {
                color: black !important;
            }
            .text-blue-600, .text-emerald-600, .text-rose-600 {
                color: black !important;
                font-weight: bold !important;
            }
            .bg-blue-600, .bg-slate-900 {
                background: transparent !important;
                color: black !important;
                border: 1px solid black !important;
            }
        }
    </style>
